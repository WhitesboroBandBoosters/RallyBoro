name: rallyboro-app
services:
  app:
    build: .
    image: rallyboro:foundation
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      RALLYBORO_DATABASE_URL: ${RALLYBORO_DATABASE_URL:?Set the JDBC PostgreSQL URL}
      RALLYBORO_DATABASE_USERNAME: ${RALLYBORO_DATABASE_USERNAME:?Set the application database role}
    secrets:
      - source: database_password
        target: RALLYBORO_DATABASE_PASSWORD
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
secrets:
  database_password:
    file: ${RALLYBORO_DATABASE_PASSWORD_FILE:?Set the absolute application password file path}
networks:
  database:
    external: true
    name: ${RALLYBORO_DATABASE_NETWORK:?Set the existing Docker database network}
