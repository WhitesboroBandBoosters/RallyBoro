spring.application.name=rallyboro
spring.datasource.url=${RALLYBORO_DATABASE_URL}
spring.datasource.username=${RALLYBORO_DATABASE_USERNAME}
spring.datasource.password=${RALLYBORO_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.clean-disabled=true
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.forward-headers-strategy=none
spring.graphql.graphiql.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.tomcat.max-http-form-post-size=64KB
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'
rallyboro.local-accounts=${RALLYBORO_LOCAL_ACCOUNTS:true}
rallyboro.accounts-file=${RALLYBORO_ACCOUNTS_FILE:}
